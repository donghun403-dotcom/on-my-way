name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      verification_target:
        description: Verification target
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production-plan

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 잡을 둘로 나눈 이유
#
#   전에는 한 잡이 전체 E2E를 두 번 돌렸다 — CI 서버에 한 번, 배포된 프리뷰에 한 번.
#   스위트가 758건까지 자라면서 한 패스가 약 20분이 됐고, 두 패스 합이 35분 상한을
#   넘겨 PR #36이 프리뷰 패스 535/758에서 잘렸다. 실패한 테스트는 없었다.
#
#   worker 수를 올려서 줄이지 않는다. 이 리포는 병렬 부하에서 iphone-webkit이 깨지는
#   이력이 있어서, 결정적 타임아웃을 비결정적 flake로 바꾸는 거래가 된다.
#   대신 (1) 로컬 패스를 샤드 둘로 나누고 (2) 프리뷰 패스를 통합 부분집합으로 줄인다.
#   timeout-minutes는 올리지 않는다 — 추세선이 몇 PR 안에 다시 넘는다.
#
#   실패 지점도 갈린다: job A가 빨간색이면 앱 로직, job B가 빨간색이면 배포 배선이다.

jobs:
  # ── job A ──────────────────────────────────────────────────────────────────
  # 유닛 + 문법 + 전체 로컬 E2E. 디바이스 매트릭스 5개 프로젝트를 모두 포함한다.
  # 샤드당 worker는 2로 유지한다(playwright.config.js). 샤드는 프로세스를 나눌 뿐
  # 한 러너 안의 동시 실행 수를 늘리지 않으므로 경합이 늘지 않는다.
  validate:
    name: validate (shard ${{ matrix.shard }}/2)
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || inputs.verification_target != 'production-plan')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 유닛과 문법은 샤드마다 다시 돈다. 합쳐 5초라 잡을 더 쪼갤 값어치가 없고,
      # 대신 두 샤드가 모두 같은 게이트를 통과한다.
      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          # 하위 프로젝트의 node_modules도 뺀다. mobile/이 자기 의존성을 갖게 되면서
          # './node_modules/*'로는 mobile/node_modules가 걸러지지 않는다 — 이 잡은
          # mobile에 npm ci를 하지 않아 지금은 비어 있지만, 로컬에서 한 번 설치하면
          # 같은 명령이 의존성 수천 파일을 node --check 한다.
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*' -print0)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Playwright against the CI server
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2 --reporter=line

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-local-shard${{ matrix.shard }}-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ── job B ──────────────────────────────────────────────────────────────────
  # 배포 + 프리뷰 통합 부분집합.
  #
  # 부분집합 구성 근거
  #
  #   프리뷰 패스는 로컬(serve-local.cjs)이 구조적으로 볼 수 없는 워커 전용 분기만
  #   검증한다. 로컬 서버는 worker.mjs의 fetch 핸들러를 실행하지 않는다 —
  #   `import("./worker.mjs")`를 하지만 꺼내 쓰는 것은 recordFunnelEvent 하나뿐이고,
  #   라우팅·저장소·정적 자산은 전부 별도 구현이다. 두 서버는 공유 서비스 모듈
  #   (auth-service.mjs, ai-credits-service.mjs)에서만 만난다.
  #
  #   그래서 프리뷰에서만 검증되는 것: USERS_KV 저장소 배선, ASSETS 바인딩과
  #   SPA 폴백, NON_HTML_ASSET_PATH 가드, /api 출처 검사 403, 세션 없는 요청의
  #   401 게이트, 그리고 실제 배포본 위에서의 게스트 부팅.
  #
  #   프로젝트는 desktop-chromium 하나만 돈다. 디바이스 매트릭스는 job A가 담당한다 —
  #   CSS와 뷰포트 동작은 서버가 달라진다고 바뀌지 않는다. responsive는 1건만,
  #   preview-integration.spec.js 안에서 390x844 가로 넘침 검사로 남긴다.
  #
  # 프리뷰에서 제외한 스펙과 그 이유
  #
  #   auth / cheer / day-page / diary-book / mate / onboarding / plan / pricing /
  #   storage-recovery / legal
  #     → 전부 helpers.js의 mockAccountExperience(또는 자체 page.route)로 서버 응답을
  #       가로채 메모리 상태에서 채운다. 서버를 관찰하지 않으므로 프리뷰에서 돌려도
  #       로컬과 바이트 단위로 같은 결과가 나온다. 배선 커버리지가 0이다.
  #   responsive
  #     → 뷰포트·CSS 전용. 위에 적은 대로 1건만 통합 스펙으로 옮겼다.
  #
  # 아직 어디서도 검증되지 않는 것 (조용히 빠뜨리지 않으려고 적는다)
  #
  #   ENERGY_LEDGER DO 실제 동작, 크레딧 예약→커밋, secure 쿠키, AI_RATE_LIMITER,
  #   하드 페이월 402.
  #     → 전부 로그인 세션이 필요한데 프리뷰는 ALLOW_DEV_LOGIN=false라 E2E가 세션을
  #       만들 수 없다. 세션 없는 요청은 401에서 끝나고, 그 401은 레이트 리미터와
  #       페이월 게이트보다 앞에 있다(worker.mjs의 handleAiGenerationRequest).
  #       DO 바인딩이 빠지면 energy-ledger-client가 조용히 KV로 물러나므로 배포도
  #       실패하지 않는다. 이 분기들은 유닛 테스트로 덮어야 한다.
  preview:
    name: preview integration
    needs: validate
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name != 'workflow_dispatch' || inputs.verification_target != 'production-plan')
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # desktop-chromium 하나만 돌리므로 webkit은 받지 않는다.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Preview Wrangler config
        shell: bash
        env:
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          test -n "${CLOUDFLARE_D1_DATABASE_ID:-}"
          test "$CLOUDFLARE_D1_DATABASE_ID" != "null"
          echo "::add-mask::$CLOUDFLARE_D1_DATABASE_ID"

          generated_config="$GITHUB_WORKSPACE/wrangler.preview.generated.jsonc"

          jq --arg database_id "$CLOUDFLARE_D1_DATABASE_ID" '
            .d1_databases = [{
              "binding": "BILLING_DB",
              "database_name": "on-my-way-billing-preview",
              "database_id": $database_id,
              "migrations_dir": "migrations"
            }] |
            .assets.exclude = ((.assets.exclude // []) + ["wrangler.preview.generated.jsonc"])
          ' wrangler.preview.jsonc > "$generated_config"

          test -s "$generated_config"

          jq -e '
            (.d1_databases | length == 1) and
            (.d1_databases[0].binding == "BILLING_DB") and
            (.d1_databases[0].database_name == "on-my-way-billing-preview") and
            (.d1_databases[0].database_id | type == "string") and
            (.d1_databases[0].database_id | length > 0)
          ' "$generated_config" > /dev/null

      - name: Deploy the Cloudflare PR preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.112.0"
          command: deploy --config wrangler.preview.generated.jsonc --name on-my-way-pr-${{ github.event.pull_request.number || 'manual' }}

      - name: Require a preview deployment URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: test -n "$PREVIEW_URL"

      - name: Wait for preview static assets
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        shell: bash
        run: |
          consecutive=0
          last_result=""
          for attempt in {1..24}; do
            all_ready=1
            last_result=""
            endpoint_count=0
            while IFS='|' read -r path expected_type; do
              endpoint_count=$((endpoint_count + 1))
              if [ -z "$path" ] || [[ "$path" != /* ]]; then
                echo "Invalid readiness endpoint definition: path=$path type=$expected_type"
                exit 1
              fi
              case "$expected_type" in
                html|javascript|json) ;;
                *)
                  echo "Invalid readiness endpoint definition: path=$path type=$expected_type"
                  exit 1
                  ;;
              esac
              probe="$(curl --silent --output /dev/null --write-out '%{http_code}\t%{content_type}' --max-time 15 "$PREVIEW_URL$path" 2>/dev/null || true)"
              status="${probe%%$'\t'*}"
              content_type="${probe#*$'\t'}"
              case "$expected_type:$content_type" in
                html:text/html*) ;;
                javascript:*javascript*) ;;
                json:application/json*) ;;
                *) all_ready=0; last_result="$path status=$status content-type=$content_type" ;;
              esac
              if [ "$status" != "200" ]; then
                all_ready=0
                last_result="$path status=$status content-type=$content_type"
              fi
            done <<'ENDPOINTS'
          /app.html|html
          /script.js|javascript
          /plan-policy.mjs|javascript
          /api/health|json
          /api/auth/providers|json
          ENDPOINTS

            if [ "$endpoint_count" -ne 5 ]; then
              echo "Invalid readiness endpoint count: $endpoint_count"
              exit 1
            fi

            if [ "$all_ready" -eq 1 ]; then
              consecutive=$((consecutive + 1))
              if [ "$consecutive" -ge 2 ]; then
                exit 0
              fi
            else
              consecutive=0
            fi
            sleep 5
          done
          echo "Preview core assets did not become stable (last: $last_result)"
          exit 1

      # 배포된 워커가 실제로 해석한 바인딩을 판정한다. 설정 파일이 아니라 산출물을 본다 —
      # 주입 경로가 셋(이 워크플로의 jq / staging-config.mjs / wrangler.production.jsonc)인데
      # 검증도 셋이면 각자 표류하기 때문이다. 판정 로직은 binding-health.mjs 한 곳이다.
      - name: Verify resolved Worker bindings
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: node scripts/verify-deployed-bindings.mjs "$PREVIEW_URL"

      # 파일 목록은 위 "부분집합 구성 근거"의 규칙을 그대로 적은 것이다:
      # 서버 응답을 가로채지 않는 스펙(= 실제 워커를 관찰할 수 있는 스펙)만 남긴다.
      - name: Run the preview integration subset
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          npx playwright test \
            tests/e2e/preview-integration.spec.js \
            tests/e2e/core-loop-v2.spec.js \
            tests/e2e/today.spec.js \
            tests/e2e/ollie-memory-ux.spec.js \
            tests/e2e/records.spec.js \
            tests/e2e/modal.spec.js \
            tests/e2e/tap-targets.spec.js \
            --project=desktop-chromium \
            --reporter=line

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove generated Preview config
        if: always()
        shell: bash
        run: rm -f "$GITHUB_WORKSPACE/wrangler.preview.generated.jsonc"

  # ── 수동 검증 ───────────────────────────────────────────────────────────────
  # workflow_dispatch로 production-plan을 고른 경우에만 돈다. 배포는 하지 않고
  # 운영 도메인에 계획·반응형 스펙만 걸어 본다.
  production-plan:
    name: production plan check
    if: github.event_name == 'workflow_dispatch' && inputs.verification_target == 'production-plan'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          # 하위 프로젝트의 node_modules도 뺀다. mobile/이 자기 의존성을 갖게 되면서
          # './node_modules/*'로는 mobile/node_modules가 걸러지지 않는다 — 이 잡은
          # mobile에 npm ci를 하지 않아 지금은 비어 있지만, 로컬에서 한 번 설치하면
          # 같은 명령이 의존성 수천 파일을 node --check 한다.
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -not -path '*/node_modules/*' -print0)

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Production Plan Playwright without deployment
        env:
          E2E_BASE_URL: https://onmyway.olivenrich.com
        run: npx playwright test tests/e2e/plan.spec.js tests/e2e/responsive.spec.js --reporter=line

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-production-plan-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
